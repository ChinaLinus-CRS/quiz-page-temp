<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>订单班·货代知识竞赛抢答台</title>
<style>
:root{--bg:#f5f5f7;--blue:#0066cc;--bluef:#0071e3;--sky:#0066cc;--ink:#1d1d1f;--dim:#6e6e73;--good:#248a3d;--bad:#d70015;--eo:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"SF Pro Display","SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);height:100vh;overflow:hidden;background:#f5f5f7}
#stage{position:absolute;top:50%;left:50%;width:1920px;height:1080px;transform-origin:center center;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:center;gap:18px;padding:10px 0 0}
header img{height:58px;width:auto}
h1{text-align:center;font-size:44px;font-weight:600;color:#1d1d1f;padding:0;letter-spacing:-0.014em}
.sub{text-align:center;color:var(--dim);font-size:16px;margin-bottom:8px}
main{width:100%;flex:1;display:flex;flex-direction:column;padding:8px 26px 12px;min-height:0}
/* ===== 三栏：左记分 / 中抽奖 / 右奖金（白 utility 卡 + 发丝线） ===== */
#topGrid{display:grid;grid-template-columns:400px 1fr 400px;gap:18px;align-items:stretch;flex:1;min-height:0}
.panel{background:#ffffff;border:1px solid #e0e0e0;border-radius:18px;padding:12px 16px;display:flex;flex-direction:column}
.panel h2{color:#1d1d1f;font-size:22px;font-weight:600;letter-spacing:-0.374px;margin-bottom:8px}
/* 左：记分列表 */
.tlist{display:flex;flex-direction:column;justify-content:space-evenly;flex:1}
.tlist .row{display:grid;grid-template-columns:48px 1fr 72px 82px;gap:8px;align-items:center;
background:#ffffff;border:1px solid #e0e0e0;border-radius:11px;padding:7px 12px;border-left:6px solid var(--rc)}
.tlist .medal{font-size:26px;text-align:center}
.tlist .row{cursor:pointer;transition:background .15s,transform .15s}
.tlist .row:hover{background:#f5f5f7}
.tlist .nm{font-size:23px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{transition:transform .14s var(--eo),background .15s,filter .12s}
button:not(:disabled):hover{filter:brightness(.96)}
button:not(:disabled):active{transform:scale(.95)}
.tlist .sc{font-size:27px;font-weight:700;color:var(--rc);text-align:right;font-variant-numeric:tabular-nums}
.tlist .rm{font-variant-numeric:tabular-nums;font-size:17px;color:var(--dim);text-align:right;line-height:1.3}
.tops{display:flex;gap:8px;margin-top:2px}
.tops button{flex:1;min-width:0;height:44px;font-size:18px;border:1px solid var(--blue);border-radius:9999px;cursor:pointer;background:transparent;color:var(--blue);white-space:nowrap}
.tops button.big{background:var(--blue);color:#ffffff;font-weight:600}
.tlist .opsrow{display:none;background:rgba(255,255,255,.08);border-radius:8px;padding:6px;margin:-4px 0 8px}
/* 右：奖金列表 */
.tlist .row.selrow{outline:2px solid var(--bluef);outline-offset:1px}
.wlist{display:flex;flex-direction:column;justify-content:space-evenly;flex:1}
.wlist .row{display:grid;grid-template-columns:48px 1fr 110px;gap:8px;align-items:center;
background:#ffffff;border:1px solid #e0e0e0;border-radius:11px;padding:7px 12px;border-left:6px solid var(--rc)}
.wlist .medal{font-size:26px;text-align:center}
.wlist .nm{font-size:23px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wlist .amt{font-size:26px;font-weight:700;color:#1d1d1f;text-align:right;font-variant-numeric:tabular-nums}
.wlist .zero{color:var(--dim);font-size:14px;text-align:center;padding:8px}
/* 中：杯子（产品舞台） */
#cupPanel h2{color:#1d1d1f;font-size:19px;margin-bottom:8px}
.drawbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.drawbar select{padding:8px 14px;font-size:16px;border-radius:9999px;background:#ffffff;color:var(--ink);border:1px solid #e0e0e0}
.drawbar .pts{font-size:18px;color:#1d1d1f;font-weight:600}
.pools{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:end;flex:1}
.cupWrap{background:#ffffff;border:1px solid #e0e0e0;border-radius:18px;padding:12px 8px 14px;text-align:center;border-top:5px solid var(--pc);display:flex;flex-direction:column;justify-content:flex-end;height:100%;cursor:pointer;transition:background .15s,transform .15s}
.cupWrap:hover{background:#fafafc;transform:translateY(-2px)}
.cupWrap h3{font-size:24px;color:#1d1d1f;font-weight:600}
.cupWrap .cost{font-size:18px;color:var(--dim);margin:6px 0 10px}
.cup{position:relative;width:var(--cw,150px);height:var(--ch,180px);margin:0 auto;cursor:pointer}
.cup svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cup svg.back{z-index:1}.cup svg.front{z-index:3;transition:filter .15s}
.cup:hover svg.front{filter:drop-shadow(3px 5px 30px rgba(0,0,0,.22))}
.drawOv{position:fixed;inset:0;z-index:70;background:radial-gradient(circle at 50% 42%,rgba(29,29,31,.55),rgba(0,0,0,.85));display:flex;align-items:center;justify-content:center;opacity:0}
.drawStage{position:relative;width:640px;height:560px}
.miniCup{position:absolute;bottom:26px;left:50%;width:190px;height:236px;transform:translateX(-50%)}
.miniCup svg{position:absolute;inset:0;width:100%;height:100%}
.prizeBall{position:absolute;left:50%;top:44%;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;
background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.75),rgba(255,255,255,0) 46%),var(--pc,#f5b301);
display:flex;flex-direction:column;align-items:center;justify-content:center;color:#14202e;
box-shadow:3px 5px 30px rgba(0,0,0,.4);opacity:0}
.prizeBall .amt{font-size:64px;font-weight:700;line-height:1}
.prizeBall .who{font-size:20px;font-weight:600;margin-top:6px}
.ring{position:absolute;left:50%;top:44%;width:220px;height:220px;margin:-110px 0 0 -110px;border:3px solid #ffd76a;border-radius:50%;opacity:0}
.cf{position:absolute;left:50%;top:44%;width:12px;height:18px;border-radius:3px;opacity:0}
.cup .ball{position:absolute;z-index:2;width:var(--bs,36px);height:var(--bs,36px);border-radius:50%;display:flex;align-items:center;justify-content:center;
font-size:12px;font-weight:700;color:#14202e;background:var(--bc,#f5b301);animation:jit .8s infinite alternate}
@keyframes jit{from{transform:translate(0,0)}to{transform:translate(6px,-7px)}}
.cupWrap .hint{font-size:15px;color:var(--dim);margin-top:8px}
.bigBall{position:fixed;z-index:60;width:170px;height:170px;border-radius:50%;display:flex;align-items:center;justify-content:center;
font-size:52px;font-weight:700;color:#14202e;cursor:pointer;box-shadow:3px 5px 30px rgba(0,0,0,.35);
position:absolute;animation:pop .5s;user-select:none;flex-direction:column}
@keyframes pop{0%{transform:translateY(170px) scale(.35);opacity:0}55%{transform:translateY(-16px) scale(1.1);opacity:1}75%{transform:translateY(6px) scale(.98)}100%{transform:translateY(0) scale(1)}}
@media (prefers-reduced-motion:reduce){.bigBall{animation:none}}
/* ===== 答题（底部深色 tile，明暗交替节奏） ===== */
#quizSec{margin-top:6px;display:flex;flex-direction:column;min-height:0;flex:0 0 auto}
#quizSec h2{color:#1d1d1f;font-size:20px;font-weight:600;letter-spacing:-0.374px;margin:0 0 6px}
.qcard{background:#ffffff;border:1px solid #e0e0e0;border-radius:18px;padding:8px 16px;display:flex;flex-direction:column;flex:1;min-height:0}
.qcard .cat{color:#6e6e73;font-size:14px;font-weight:600}
.qcard .q{font-size:28px;line-height:1.3;color:#1d1d1f;flex:1;margin-top:4px;min-height:38px;display:flex;align-items:center}
.cd{display:flex;align-items:center;gap:10px;margin:4px 0;display:none}
.cd.show{display:flex}
.cd .num{font-size:38px;font-weight:700;color:var(--blue)}
.cd .tip{color:#6e6e73;font-size:15px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.opts button{padding:9px 14px;font-size:20px;text-align:left;border:1.5px solid #e0e0e0;border-radius:11px;background:#ffffff;color:#1d1d1f;cursor:pointer;line-height:1.3}
.opts button:hover{background:#f5f5f7}
.opts button.right{border-color:#248a3d;background:rgba(52,199,89,.18);color:#1d1d1f;font-weight:600}
.opts button.wrong{border-color:#d70015;background:rgba(255,59,48,.15);color:#1d1d1f}
.opts button:disabled{cursor:default}
.verdict{font-size:20px;font-weight:600;color:#1d1d1f;margin-top:6px;min-height:24px}
.applybar{margin-top:4px;display:flex;visibility:hidden;min-height:40px;flex-wrap:wrap;gap:6px;align-items:center}.applybar.show{visibility:visible}
.applybar span{color:#6e6e73;font-size:18px}
.applybar button{padding:7px 16px;font-size:17px;border:1px solid var(--blue);border-radius:9999px;background:transparent;color:var(--blue);cursor:pointer}
.applybar button:hover{background:#f5f5f7}
.qops{display:flex;gap:8px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.qops button{padding:7px 18px;font-size:17px;border:none;border-radius:9999px;background:#e8e8ed;color:#1d1d1f;cursor:pointer}
.qops button.gold{background:var(--blue);color:#ffffff;font-weight:600}
#ansView{position:absolute;inset:0;background:#f5f5f7;z-index:60;display:flex;flex-direction:column;padding:26px 60px 18px}
#ansView.hidden{display:none}
#ansView #quizSec{margin-top:0;flex:1;display:flex;flex-direction:column;min-height:0}
#ansView #quizSec h2{font-size:34px;margin:0 0 18px;color:#1d1d1f;line-height:1.2}
#ansView .qcard{flex:1;display:flex;flex-direction:column;padding:20px 40px;min-height:0}
#ansView .qcard .cat{font-size:30px}
#ansView .qcard .q{font-size:72px;line-height:1.25;margin-top:8px;min-height:90px;display:flex;align-items:center}
#ansView .cd{gap:24px;margin:10px 0}
#ansView .cd .num{font-size:130px}
#ansView .cd .tip{font-size:32px}
#ansView .opts{gap:16px;margin-top:14px}
#ansView .opts button{padding:22px 30px;font-size:46px;border-radius:18px;border-width:2px}
#ansView .verdict{font-size:44px;margin-top:12px;min-height:56px}
#ansView .applybar{margin-top:10px;min-height:80px}
#ansView .applybar span{font-size:34px}
#ansView .applybar button{padding:16px 34px;font-size:34px;border-radius:14px}
#ansView .qops{padding-top:14px}
#ansView .qops button{padding:14px 34px;font-size:30px}
#ansView #log{height:52px;font-size:20px}
#ansView .qops #btnBuzz{font-size:30px}
#log{background:#ffffff;border:1px solid #e0e0e0;border-radius:11px;padding:6px 12px;margin-top:8px;height:44px;box-sizing:border-box;overflow-y:auto;font-size:12px;color:#6e6e73;line-height:1.6}
/* ===== Apple 风微动效 ===== */
@keyframes bumpIn{0%{transform:scale(1)}35%{transform:scale(1.4)}100%{transform:scale(1)}}
.tlist .sc.bump{animation:bumpIn .45s var(--eo);display:inline-block}
@keyframes optIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.enter{animation:optIn .26s var(--eo) backwards}
@keyframes rightPop{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
.opts button.right{animation:rightPop .4s var(--eo)}
@keyframes wrongShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}55%{transform:translateX(5px)}80%{transform:translateX(-3px)}}
.opts button.wrong{animation:wrongShake .35s}
@keyframes cdTick{0%{transform:scale(1)}30%{transform:scale(1.28)}100%{transform:scale(1)}}
.cd .num.tick{animation:cdTick .42s var(--eo)}
.qcard.qin{animation:optIn .3s var(--eo)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function ballGrid(c,n){const bs=Math.round(c.w*0.16),sx=c.w/200,sy=c.h/260,rvx=bs/2/sx,rvy=bs/2/sy;
 const slots=[];let row=0;
 while(slots.length<n&&row<12){
  const yvb=48+rvy+row*(2*rvy*0.90);
  if(yvb+rvy>247)break;
  const halfW=73-17*((yvb-28)/218)-rvx*1.02-1;
  const cap=Math.max(1,Math.floor((2*halfW)/(2*rvx*1.02)));
  for(let q=0;q<cap&&slots.length<n;q++){
   const xvb=100+((q-(cap-1)/2)*(2*rvx*1.02));
   slots.push([xvb*sx-bs/2,yvb*sy-bs/2,bs]);}
  row++;}
 if(slots.length<n){for(let q=slots.length;q<n;q++)slots.push([c.w/2-bs/2,c.h/2-bs/2,bs]);}
 return slots;}
function spreadBalls(st,ctr,bs){
 const NB=[];for(let i=0;i<st.length;i++)for(let j2=i+1;j2<st.length;j2++){
  const dx=ctr[i][0]-ctr[j2][0],dy=ctr[i][1]-ctr[j2][1];
  if(Math.sqrt(dx*dx+dy*dy)<bs*1.02)NB.push([i,j2]);}
 const a=st.slice();
 function viol(arr){let n=0;for(const[p,q]of NB){if(arr[p]===arr[q])n++;}return n;}
 for(let att=0;att<80;att++){for(let i=a.length-1;i>0;i--){const r0=Math.floor(Math.random()*(i+1));[a[i],a[r0]]=[a[r0],a[i]];}
  let v=viol(a);if(v===0)return a;
  for(let t=0;t<1200;t++){const pairs=NB.filter(([p,q])=>a[p]===a[q]);const[p]=pairs[Math.floor(Math.random()*pairs.length)];
   const r=Math.floor(Math.random()*a.length);const cur=a.slice();[a[p],a[r]]=[a[r],a[p]];const nv=viol(a);
   if(nv<=v){v=nv;if(v===0)return a;}else{a.length=0;a.push(...cur);}}
  if(viol(a)===0)return a;}
 return a;}for(const[k,c]of Object.entries(CUPS)){const stock=S.stock[k];
 const d=document.createElement('div');d.className='cupWrap';d.style.setProperty('--pc',c.color);
 const cup=document.createElement('div');cup.className='cup';cup.title='点击抽 '+c.name;

 if(!stock.length){cup.insertAdjacentHTML('beforeend','<div style="position:absolute;z-index:4;inset:0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:20px;color:#5a7089;font-size:14px">已抽完</div>');}
 const view=spreadBalls(stock,slots,bs);
 view.forEach((amt,j)=>{const b=document.createElement('div');b.className='ball';
 b.style.setProperty('--bc',BALLCOL[amt]||'#f5b301');
 b.style.setProperty('--bs',bs+'px');b.style.fontSize=Math.round(bs*0.42)+'px';
 b.style.left=slots[j][0]+'px';b.style.top=slots[j][1]+'px';
 b.style.animationDelay=(j*0.13)+'s';b.textContent=amt;cup.appendChild(b);});
d.onclick=()=>drawCup(k,cup);
d.innerHTML=`<h3>${c.name}</h3><div class="cost">${c.cost} 积分/次</div>`;
d.appendChild(cup);d.insertAdjacentHTML('beforeend','<div class="hint">点杯子抽奖</div>');
wrap.appendChild(d);}
showWins();}

const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';
o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);

var KW='海运 OCEAN   报关 CUSTOMS   提单 B/L   整柜 FCL   拼箱 LCL   卡亚俄 CALLAO   拉美 LATAM   订舱 BOOKING   免堆存 DEMURRAGE   船期 SCHEDULE   目的港 POD   ';
function ringFxShow(done){
  var ov=document.getElementById('ringFx');
  // build rings once
  if(!ov.dataset.built){
    var svgNS='http://www.w3.org/2000/svg';
    var svg=document.createElementNS(svgNS,'svg');
    svg.setAttribute('viewBox','0 0 1000 1000');svg.style.width='100%';svg.style.height='100%';
    var defs=document.createElementNS(svgNS,'defs');
    [[300,'rr1'],[365,'rr2'],[430,'rr3']].forEach(function(r){
      var p=document.createElementNS(svgNS,'path');
      p.setAttribute('id',r[1]);p.setAttribute('d','M 500,500 m -'+r[0]+',0 a '+r[0]+','+r[0]+' 0 1,1 '+(2*r[0])+',0 a '+r[0]+','+r[0]+' 0 1,1 -'+(2*r[0])+',0');
      p.setAttribute('fill','none');defs.appendChild(p);
    });
    svg.appendChild(defs);
    [[300,34,'rr1','46s'],[365,30,'rr2','58s'],[430,27,'rr3','72s']].forEach(function(c,i){
      var t=document.createElementNS(svgNS,'text');
      t.setAttribute('style','font-family:"Microsoft YaHei",ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:0px;word-spacing:18px;fill:'+(i===1?'#265daa':'#e8e8ec')+';opacity:'+(0.98-i*0.16));
      t.setAttribute('font-size',c[1]);
      var tp=document.createElementNS(svgNS,'textPath');
      tp.setAttributeNS('http://www.w3.org/1999/xlink','href','#'+c[2]);
      var s='';while(s.length<260)s+=KW;tp.textContent=s;
      t.appendChild(tp);svg.appendChild(t);
    });
    var core=document.createElement('div');core.id='ringCore';core.textContent='开始答题';
    ov.appendChild(svg);ov.appendChild(core);ov.dataset.built='1';
  }
  ov.classList.add('show');ov.classList.remove('out');
  setTimeout(function(){ov.classList.add('out');},1500);
  setTimeout(function(){ov.classList.remove('show','out');done&&done();},1950);
}
function openAns(){
  var av=document.getElementById('ansView');
  if(av.classList.contains('hidden')){
    ringFxShow(function(){av.classList.remove('hidden');});
  }else{av.classList.remove('hidden');}
}
function exitAns(){stopAll();if(cur!=null&&!buzzed){if(pool.indexOf(cur)<0)pool.push(cur);cur=null;renderTList();}document.getElementById('ansView').classList.add('hidden');}
function nextQ(){stopAll();if(!pool.length){document.getElementById('qText').textContent='🎉 题库已抽完！';return;}
openAns();cur=pool.splice(Math.floor(Math.random()*pool.length),1)[0];if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
buzzed=false;curRight=null;
var qc0=document.getElementById('qCat');if(qc0)qc0.textContent='【'+QA[cur][0]+'】 题库剩余 '+pool.length+' 题';
document.getElementById('qText').textContent='Q：'+QA[cur][1];
 const qc=document.querySelector('.qcard');qc.classList.remove('qin');void qc.offsetWidth;qc.classList.add('qin');
document.getElementById('opts').innerHTML='';document.getElementById('verdict').textContent='';
document.getElementById('applyBar').classList.remove('show');
renderTList();startCd();}
function startCd(){cdLeft=10;buzzed=false;const qc=document.querySelector('.qcard');qc.style.cursor='pointer';qc.onclick=()=>buzz();const box=document.getElementById('cdBox');
box.classList.add('show');document.getElementById('cdNum').textContent=cdLeft;
box.querySelector('.tip').textContent='抢答倒计时…… 有人抢答：按【空格】或直接点题目区停止';
document.getElementById('btnBuzz').style.display='inline-block';
clearInterval(cdTimer);cdTimer=setInterval(()=>{cdLeft--;
if(cdLeft<=0){document.getElementById('cdNum').textContent=0;stopAll();
pool.push(cur);
const v=document.getElementById('verdict');v.style.color='var(--dim)';
v.textContent='⏰ 无人抢答，本题跳过、放回题池';
document.getElementById('btnBuzz').style.display='none';log('无人抢答跳过一题（已放回池）');renderTList();}
else{const n=document.getElementById('cdNum');n.textContent=cdLeft;n.classList.remove('tick');void n.offsetWidth;n.classList.add('tick');}},1000);}
function stopAll(){clearInterval(cdTimer);cdTimer=null;clearInterval(ansTimer);ansTimer=null;
document.getElementById('cdBox').classList.remove('show');const qc=document.querySelector('.qcard');if(qc){qc.onclick=null;qc.style.cursor='';}}
function buzz(){if(!cdTimer){log('抢答无效：倒计时已结束（本题已被跳过放回池）');return;}if(buzzed)return;buzzed=true;log('抢答确认，出选项…');stopAll();
if(QA[cur].length>3){showOpts();startAnsCd();}else{showOpenJudge();}}
window.onerror=function(m,src,line){var d=document.getElementById('errBar');if(!d){d=document.createElement('div');d.id='errBar';d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:9999;background:#d70015;color:#fff;font:600 20px/1.4 -apple-system,PingFang SC,sans-serif;padding:8px 14px';document.body.appendChild(d);}d.textContent='脚本错误：'+m+' （第'+line+'行）— 截图发我';return false;};
function spaceBuzz(e){if((e.code==='Space'||e.key===' ')&&cdTimer){e.preventDefault();buzz();return true;}return false;}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){exitAns();return;}spaceBuzz(e);},true);
document.addEventListener('keyup',e=>{if(!buzzed&&cdTimer&&(e.code==='Space'||e.key===' ')){e.preventDefault();buzz();}},true);
function startAnsCd(){cdLeft=5;const box=document.getElementById('cdBox');
box.classList.add('show');document.getElementById('cdNum').textContent=cdLeft;
box.querySelector('.tip').textContent='答题倒计时…… 5 秒内点选选手给出的答案，超时视为答错';
clearInterval(ansTimer);ansTimer=setInterval(()=>{cdLeft--;
if(cdLeft<=0){stopAnsCd();timeoutJudge();}
else{const n=document.getElementById('cdNum');n.textContent=cdLeft;n.classList.remove('tick');void n.offsetWidth;n.classList.add('tick');}},1000);}
function stopAnsCd(){clearInterval(ansTimer);ansTimer=null;document.getElementById('cdBox').classList.remove('show');}
function timeoutJudge(){curRight=false;
document.querySelectorAll('#opts button').forEach(b=>{b.disabled=true;});
const rightText=QA[cur][2];
document.querySelectorAll('#opts button').forEach(b=>{if(b.textContent.split('．').slice(1).join('．')===rightText)b.classList.add('right');});
const v=document.getElementById('verdict');v.style.color='var(--bad)';
v.textContent='⏰ 答题超时，视为答错！正确答案：'+rightText;
showApply();log('答题超时视为答错（'+QA[cur][1].slice(0,18)+'…）');}
function showOpts(){const [,,right,wrongs]=QA[cur];
const arr=[right,...wrongs].map((t,i)=>({t,r:i===0}));
for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
const box=document.getElementById('opts');box.innerHTML='';
arr.forEach((o,k)=>{const btn=document.createElement('button');btn.textContent=String.fromCharCode(65+k)+'．'+o.t;
btn.onclick=()=>judge(btn,o.r,right);btn.classList.add('enter');btn.style.animationDelay=(k*45)+'ms';box.appendChild(btn);});}
function showOpenJudge(){const box=document.getElementById('opts');box.innerHTML='';
const bShow=document.createElement('button');bShow.textContent='💡 显示答案';
bShow.onclick=()=>{bShow.disabled=true;
const v=document.getElementById('verdict');v.style.color='#a86e00';
v.textContent='答案：'+QA[cur][2];};
const bR=document.createElement('button');bR.textContent='✅ 答对';
bR.onclick=()=>{stopAnsCd();curRight=true;
const v=document.getElementById('verdict');v.style.color='var(--good)';v.textContent='✅ 判定：回答正确';showApply();};
const bW=document.createElement('button');bW.textContent='❌ 答错';
bW.onclick=()=>{stopAnsCd();curRight=false;
const v=document.getElementById('verdict');v.style.color='var(--bad)';
v.textContent='❌ 判定：回答错误。正确答案：'+QA[cur][2];showApply();};
box.appendChild(bShow);box.appendChild(bR);box.appendChild(bW);}
function judge(btn,isRight,rightText){stopAnsCd();curRight=isRight;
document.querySelectorAll('#opts button').forEach(b=>{b.disabled=true;});
document.querySelectorAll('#opts button').forEach(b=>{if(b.textContent.split('．').slice(1).join('．')===rightText)b.classList.add('right');});
if(!isRight&&btn)btn.classList.add('wrong');
const v=document.getElementById('verdict');
v.style.color=isRight?'var(--good)':'var(--bad)';
v.textContent=isRight?'✅ 回答正确！':'❌ 回答错误！正确答案：'+rightText;
showApply();}
function showApply(){const bar=document.getElementById('applyBar');bar.classList.add('show');
const ab=document.getElementById('applyBtns');ab.innerHTML='';
S.teams.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t;
b.onclick=()=>applyTo(i);b.classList.add('enter');b.style.animationDelay=(i*35)+'ms';ab.appendChild(b);});}
function applyTo(i){const d=curRight?10:-10;S.scores[i]+=d;S.done++;save();renderAll();bumpScore(i);
log(`${S.teams[i]} 抢答${curRight?'正确 +10':'错误 -10'} → 累计 ${S.scores[i]}（剩 ${remain(i)}）`);
document.getElementById('applyBar').classList.remove('show');
document.getElementById('btnBuzz').style.display='none';}
function renderAll(){renderTList();renderWList();}
function fitStage(){const s=Math.min(innerWidth/1920,innerHeight/1080);
 document.getElementById('stage').style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener('resize',fitStage);fitStage();
renderAll();renderDraw();
</script>

<script>
/* 指点模式 v3.1：#pick 开启。右键元素=对话修改；右侧常驻对话面板（历史+撤销，借鉴 Onlook/Stagewise） */
(function(){
var _pickOn = (location.hash!=='#nopick') && (sessionStorage.getItem('pickOn')!=='0');
if(!_pickOn){
  /* 无 hash 时可用 Ctrl+Alt+P 开关指点模式 */
  document.addEventListener('keydown',function(e){if(e.ctrlKey&&e.altKey&&e.key.toLowerCase()==='p'){e.preventDefault();sessionStorage.setItem('pickOn',(_pickOn?'0':'1'));location.reload();}},true);
  return;
}
document.addEventListener('keydown',function(e){if(e.ctrlKey&&e.altKey&&e.key.toLowerCase()==='p'){e.preventDefault();sessionStorage.setItem('pickOn','0');location.reload();}},true);
window.pickMode=true;(function(){var bb=document.getElementById('brandBar');if(!bb)return;var st=document.createElement('style');st.textContent='#brandBar *{pointer-events:auto}';document.head.appendChild(st);})();
var picked=[];
function pathOf(el){
  if(el===document.body)return 'body';
  if(el.id)return '#'+el.id;
  var s=el.tagName.toLowerCase(),p=el.parentNode,i=[].slice.call(p.children).indexOf(el)+1;
  return pathOf(p)+' > '+s+':nth-child('+i+')';
}
function info(el){return {tag:el.tagName.toLowerCase(),id:el.id||null,cls:(el.className&&String(el.className.baseVal!==undefined?el.className.baseVal:el.className)||'').slice(0,120)||null,text:(el.innerText||'').trim().replace(/\s+/g,' ').slice(0,60),selector:pathOf(el)};}
/* hover 高亮+信息条 */
var tip=document.createElement('div');tip.style.cssText='position:fixed;z-index:2147483646;background:#16181d;color:#9fc5ff;font:12px monospace;padding:4px 8px;border-radius:6px;pointer-events:none;display:none';
document.body.appendChild(tip);
document.addEventListener('mouseover',function(e){var el=e.target;if(el.closest('#pickPanel,#pickMenu'))return;if(window._hover&&window._hover!==el){window._hover.style.outline='';window._hover.style.background=window._hover._pb||'';window._hover.style.cursor=window._hover._pc||'';}window._hover=el;if(picked.indexOf(el)<0){el._pb=el.style.background;el._pc=el.style.cursor;el.style.background='rgba(255,106,0,.18)';el.style.cursor='crosshair';el.style.outline='2px solid #ff6a00';}var r=el.getBoundingClientRect();var it=info(el);tip.textContent=it.tag+(it.id?'#'+it.id:'')+' '+Math.round(r.width)+'x'+Math.round(r.height);tip.style.display='block';tip.style.left=Math.min(r.left,innerWidth-160)+'px';tip.style.top=Math.max(4,r.top-24)+'px';},true);
document.addEventListener('mouseout',function(e){if(window._hover===e.target){if(picked.indexOf(e.target)<0){e.target.style.outline='';e.target.style.background=e.target._pb||'';e.target.style.cursor=e.target._pc||'';}window._hover=null;tip.style.display='none';}},true);
/* 左键编号：普通点=只选这一个（清掉其他）；Ctrl+点=追加多选；Ctrl+点已选=移除 */
document.addEventListener('click',function(e){
  var el=e.target;if(el.closest('#pickPanel,#pickMenu'))return;var bbEl=el.closest?el.closest('#brandBar'):null;if(bbEl)el=bbEl;
  e.preventDefault();e.stopPropagation();
  var k=picked.indexOf(el);
  if(k>=0){if(e.ctrlKey){if(el._badge)el._badge.remove();el.style.outline='';picked.splice(k,1);renumber();}return;}
  if(!e.ctrlKey){picked.slice().forEach(function(o){if(o._badge)o._badge.remove();o.style.outline='';picked.splice(picked.indexOf(o),1);});}
  picked.push(el);el.style.outline='2px dashed #ff6a00';
  var b=document.createElement('div');b.textContent=picked.length;
  b.style.cssText='position:absolute;z-index:2147483646;background:#ff6a00;color:#fff;font:700 16px/1 monospace;padding:5px 9px;border-radius:7px;pointer-events:none';
  document.body.appendChild(b);el._badge=b;place(b,el);renumber();
},true);
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){var t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable))return;e.preventDefault();e.stopPropagation();doUndo();}},true);
document.addEventListener('keydown',function(e){if(e.key!=='Escape')return;picked.slice().forEach(function(o){if(o._badge)o._badge.remove();o.style.outline='';o.style.background=o._pb||'';o.style.cursor=o._pc||'';picked.splice(picked.indexOf(o),1);});renumber();},true);
function place(b,el){var r=el.getBoundingClientRect();b.style.left=(r.left+6)+'px';b.style.top=(r.top+6)+'px';}
function renumber(){picked.forEach(function(el,i){el._badge.textContent=i+1;place(el._badge,el);});render();}
/* 常驻对话面板（sessionStorage 存历史，刷新不丢） */
var panel=document.createElement('div');panel.id='pickPanel';
panel.style.cssText='position:fixed;right:14px;top:14px;bottom:14px;width:340px;z-index:2147483647;background:#14161b;color:#e8e8ec;font:13px/1.6 monospace;border-radius:14px;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.55);border:1px solid #2a2d35';
panel.innerHTML='<div style="padding:12px 14px;border-bottom:1px solid #2a2d35;display:flex;justify-content:space-between;align-items:center"><b style="color:#ff9a3c">指点模式</b><button id="pickUndo" style="font:700 12px monospace;padding:5px 12px;border:0;border-radius:7px;background:#3a2b1a;color:#ffb35c;cursor:pointer">撤销上一步</button></div>'+
 '<div style="padding:8px 10px;color:#7a8291;font-size:12px">右键元素=对话修改 · 点=编号 · Ctrl+点移除</div>'+
 '<div id="pickLog" style="flex:1;overflow-y:auto;padding:6px 14px"></div>'+
 '<div id="pickSel" style="padding:8px 14px;color:#9fc5ff;border-top:1px solid #2a2d35;font-size:12px;max-height:110px;overflow:hidden"></div>';
document.body.appendChild(panel);
var LOG=[];
try{LOG=JSON.parse(sessionStorage.getItem('pickLog')||'[]');}catch(e){}
function render(){
  var log=document.getElementById('pickLog');
  log.innerHTML=LOG.map(function(m){return '<div style="margin:6px 0;padding:8px 10px;border-radius:9px;background:'+(m.r==='u'?'#1d2433':'#1e2b1e')+';max-width:100%;word-break:break-all"><b style="color:'+(m.r==='u'?'#8ab4ff':'#7ce38b')+'">'+(m.r==='u'?'你':'AI')+'</b> '+m.t+'</div>';}).join('');
  log.scrollTop=log.scrollHeight;
  sessionStorage.setItem('pickLog',JSON.stringify(LOG));
  var sel=document.getElementById('pickSel');
  sel.innerHTML=picked.length?('已编号：'+picked.map(function(el,i){return (i+1)+'.'+(info(el).text||info(el).tag).slice(0,14);}).join(' · ')):'还没点选元素';
}
function say(r,t){LOG.push({r:r,t:t});render();}
document.getElementById('pickUndo').onclick=function(){
  var btn=this;btn.disabled=true;btn.textContent='撤销中…';
  fetch('http://127.0.0.1:49331/undo',{method:'POST'}).then(function(x){return x.json();}).then(function(res){
    say('a',res.reply||'已撤销');btn.disabled=false;btn.textContent='撤销上一步';
    if(res.ok)setTimeout(function(){location.reload();},900);
  }).catch(function(){say('a','服务器没开');btn.disabled=false;btn.textContent='撤销上一步';});
};
/* 右键菜单：修改此元素 / 撤回修改 / 整页对话 */
var menu=null;
function closeMenu(){if(menu){menu.remove();menu=null;}}
function askBox(title, placeholder, onSend){
  closeMenu();
  menu=document.createElement('div');menu.id='pickMenu';
  menu.style.cssText='position:fixed;z-index:2147483648;left:'+Math.min(lastX,innerWidth-360)+'px;top:'+Math.min(lastY,innerHeight-160)+'px;background:#16181d;color:#fff;font:13px/1.5 monospace;padding:12px;border-radius:12px;width:340px;box-shadow:0 10px 40px rgba(0,0,0,.6)';
  menu.innerHTML='<div style="color:#8ab4ff;margin-bottom:6px;word-break:break-all">'+title+'</div>'+
   '<input id="pickInput" placeholder="'+placeholder+'" style="width:100%;box-sizing:border-box;font:13px monospace;padding:8px;border:1px solid #333;border-radius:8px;background:#0d0f13;color:#fff;outline:none"/>';
  document.body.appendChild(menu);
  var inp=document.getElementById('pickInput');inp.focus();
  inp.addEventListener('keydown',function(ev){if(ev.key==='Enter'){var v=inp.value.trim();if(v)onSend(v);}});
}
function sendPayload(payload,label){
  say('u',label);
  closeMenu();say('a','思考中…');
  fetch('http://127.0.0.1:49331/pick',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
    .then(function(r){return r.json();})
    .then(function(res){
      LOG.splice(LOG.length-1,1);
      say('a',(res.reply||('已改 '+res.applied+' 处'))+(res.applied?' · 刷新中…':''));
      if(res.applied)setTimeout(function(){location.reload();},1200);
      render();
    })
    .catch(function(){LOG.splice(LOG.length-1,1);say('a','服务器没开，指令已复制');navigator.clipboard.writeText(JSON.stringify(payload));});
}
function doUndo(){
  say('u','撤回修改');
  say('a','撤销中…');
  fetch('http://127.0.0.1:49331/undo',{method:'POST'})
    .then(function(x){return x.json();})
    .then(function(res){
      LOG.splice(LOG.length-1,1);
      say('a',res.reply||'已撤销');
      if(res.ok)setTimeout(function(){location.reload();},900);
    })
    .catch(function(){LOG.splice(LOG.length-1,1);say('a','服务器没开');});
}
var lastX=80,lastY=80;
window.startEdit=function(el2){
  var parent=el2.parentNode;
  if(parent===document.body){say('e','该元素不属于任何布局容器，改用对话移动');return;}
  var origIdx=[].slice.call(parent.children).indexOf(el2);
  var parentBefore=parent.cloneNode(true);
  var r0=el2.getBoundingClientRect();
  var pr0=parent.getBoundingClientRect();
  var horizontal=pr0.width>=pr0.height;
  /* 占位块 */
  var ph=document.createElement('div');
  ph.style.cssText='box-sizing:border-box;width:'+r0.width+'px;height:'+r0.height+'px;border:2px dashed #265daa;border-radius:10px;background:rgba(38,93,170,.08);transition:all .18s ease;flex:none';
  parent.insertBefore(ph,el2);
  el2.style.cssText+=';position:fixed;z-index:2147483645;width:'+r0.width+'px;height:'+r0.height+'px;margin:0;box-shadow:0 16px 50px rgba(0,0,0,.45);opacity:.92;';
  el2.style.left=r0.left+'px';el2.style.top=r0.top+'px';
  var hd=document.createElement('div');
  hd.style.cssText='position:fixed;z-index:2147483647;width:20px;height:20px;background:#265daa;border:2px solid #fff;border-radius:50%;cursor:nwse-resize';
  document.body.appendChild(hd);
  var bar=document.createElement('div');
  bar.style.cssText='position:fixed;z-index:2147483647;background:#16181d;padding:8px;border-radius:10px;display:flex;gap:8px;box-shadow:0 8px 30px rgba(0,0,0,.6)';
  bar.innerHTML='<button id="peApply" style="font:700 13px monospace;padding:7px 18px;border:0;border-radius:8px;background:#1f7a3d;color:#fff;cursor:pointer">应用</button><button id="peCancel" style="font:700 13px monospace;padding:7px 14px;border:0;border-radius:8px;background:#555;color:#fff;cursor:pointer">取消</button>';
  document.body.appendChild(bar);
  var prevStyle=el2.getAttribute('style');
  var resized=false;
  function placeUI(){var rr=el2.getBoundingClientRect();hd.style.left=(rr.right-10)+'px';hd.style.top=(rr.bottom-10)+'px';bar.style.left=Math.min(rr.left,innerWidth-190)+'px';bar.style.top=Math.max(6,rr.top-52)+'px';}
  placeUI();
  function cleanup(){
    el2.setAttribute('style',prevStyle||'');
    if(ph.parentNode)ph.remove();hd.remove();bar.remove();
    document.removeEventListener('mousemove',dragMove,true);document.removeEventListener('mouseup',dragUp,true);
    document.removeEventListener('mousemove',rsMove,true);document.removeEventListener('mouseup',rsUp,true);
    document.removeEventListener('keydown',escH,true);tip.style.display='none';
  }
  var dragging=false,rszing=false,dx0=0,dy0=0;
  function insertAt(x,y){
    var sibs=[].slice.call(parent.children).filter(function(s){return s!==el2&&s!==ph;});
    var idx=sibs.length;
    for(var i=0;i<sibs.length;i++){var r=sibs[i].getBoundingClientRect();
      if(horizontal? (x<r.left+r.width/2) : (y<r.top+r.height/2)){idx=i;break;}}
    var ref=sibs[idx]||null;parent.insertBefore(ph,ref);
  }
  function dragDown(ev){if(rszing)return;dragging=true;dx0=ev.clientX-el2.getBoundingClientRect().left;dy0=ev.clientY-el2.getBoundingClientRect().top;ev.preventDefault();ev.stopPropagation();}
  function dragMove(ev){
    placeUI();
    if(rszing)return;
    if(!dragging){tip.textContent='拖动=排序让位 · 蓝点=缩放（其他组件自适应）· 「应用」写回文件';tip.style.display='block';return;}
    el2.style.left=(ev.clientX-dx0)+'px';el2.style.top=(ev.clientY-dy0)+'px';
    insertAt(ev.clientX,ev.clientY);
    tip.textContent='松手放到虚线位 · 其他组件已让位';tip.style.display='block';tip.style.left=Math.min(ev.clientX+14,innerWidth-240)+'px';tip.style.top=Math.max(4,ev.clientY-26)+'px';
    placeUI();
  }
  function dragUp(){dragging=false;}
  el2.addEventListener('mousedown',dragDown,true);
  document.addEventListener('mousemove',dragMove,true);document.addEventListener('mouseup',dragUp,true);
  hd.addEventListener('mousedown',function(ev){ev.stopPropagation();rszing=true;ev.preventDefault();},true);
  function rsMove(ev){if(!rszing)return;var rr=el2.getBoundingClientRect();el2.style.width=Math.max(30,ev.clientX-rr.left)+'px';el2.style.height=Math.max(24,ev.clientY-rr.top)+'px';ph.style.width=el2.style.width;ph.style.height=el2.style.height;resized=true;placeUI();
    tip.textContent='缩放中 · 应用后其他组件按比例自适应';tip.style.display='block';tip.style.left=Math.min(ev.clientX+14,innerWidth-260)+'px';tip.style.top=Math.max(4,ev.clientY-24)+'px';}
  function rsUp(){rszing=false;}
  document.addEventListener('mousemove',rsMove,true);document.addEventListener('mouseup',rsUp,true);
  function escH(ev){if(ev.key==='Escape'){cleanup();say('a','已取消编辑');}}
  document.addEventListener('keydown',escH,true);
  document.getElementById('peCancel').onclick=function(){cleanup();say('a','已取消编辑');};
  /* 自适应核心：把父容器变成弹性流，子项按当前像素宽换算 flex 比例，全部自适应 */
  function fluidify(){
    parent.style.display=horizontal?'flex':'flex';
    parent.style.flexDirection=horizontal?'row':'column';
    parent.style.flexWrap='wrap';
    var kids=[].slice.call(parent.children).filter(function(k){return k!==ph&&k!==el2;});
    kids.push(el2);
    var total=0,widths={};
    kids.forEach(function(k){var r=k.getBoundingClientRect();var w=horizontal?Math.max(r.width,20):Math.max(r.height,20);widths[k._pk=w]=k;total+=w;});
    kids.forEach(function(k){var g=(k._pk/total*100);k.style.flexGrow=g.toFixed(2);k.style.flexShrink='1';k.style.flexBasis='0';k.style.minWidth=horizontal?'60px':'';if(!horizontal)k.style.minHeight='24px';});
  }
  document.getElementById('peApply').onclick=function(){
    parent.insertBefore(el2,ph);
    var newIdx=[].slice.call(parent.children).indexOf(el2);
    fluidify();
    var parentAfter=parent.cloneNode(true);
    parentAfter.querySelectorAll('#pickPanel,#pickMenu').forEach(function(n){n.remove();});
    parentBefore.querySelectorAll('#pickPanel,#pickMenu').forEach(function(n){n.remove();});
    var fh=parentBefore.outerHTML.slice(0,4000),th=parentAfter.outerHTML.slice(0,4000);
    cleanup();
    if(newIdx===origIdx&&!resized){say('a','位置大小没变，无需应用');return;}
    var it3=info(el2);
    var payload={drag:true,cmd:'组件编辑（自适应）：1) 若顺序变化，把该元素移到父容器内第 '+(newIdx+1)+' 个子元素位置；2) 父容器已改为 flex'+(horizontal?' 横向':'纵向')+'流式布局，各子元素带 flex-grow 比例内联样式——请把 from_html 整块替换为 to_html 的布局效果（保持 to_html 中的 flex 声明与顺序）',selector:it3.selector,from_html:fh,to_html:th,style_add:''};
    sendPayload(payload,'（自适应组件编辑）'+(it3.text||it3.tag)+' → 位置#'+(newIdx+1)+(resized?' +新尺寸':''));
  };
  say('a','自适应组件编辑：拖动排序 · 蓝点缩放 · 其他组件联动让位与缩放');
}

document.addEventListener('contextmenu',function(e){
  var el=e.target;if(el.closest('#pickPanel,#pickMenu'))return;var bbEl=el.closest?el.closest('#brandBar'):null;if(bbEl)el=bbEl;
  e.preventDefault();e.stopPropagation();
  lastX=e.clientX;lastY=e.clientY;
  closeMenu();
  menu=document.createElement('div');menu.id='pickMenu';
  menu.style.cssText='position:fixed;z-index:2147483648;left:'+Math.min(e.clientX,innerWidth-300)+'px;top:'+Math.min(e.clientY,innerHeight-200)+'px;background:#16181d;color:#fff;font:13px/1.6 monospace;padding:8px;border-radius:12px;width:280px;box-shadow:0 10px 40px rgba(0,0,0,.6)';
  var it=info(el);
  menu.innerHTML='<div style="color:#7a8291;font-size:11px;padding:2px 8px 6px;word-break:break-all">&lt;'+it.tag+(it.id?'#'+it.id:'')+'&gt; '+(it.text||'').slice(0,24)+'</div>'+
   '<div id="pmEdit" class="pmi">修改此元素…</div>'+
   '<div id="pmPage" class="pmi">对整个网页对话…</div>'+
   '<div id="pmUndo" class="pmi" style="color:#ffb35c">撤回修改</div>'+
   '<div id="pmDrag" class="pmi" style="color:#7ce38b">拖动此元素…</div>'+
   '<style>.pmi{padding:9px 10px;border-radius:8px;cursor:pointer}.pmi:hover{background:#265daa}</style>';
  document.body.appendChild(menu);
  document.getElementById('pmEdit').onclick=function(){
    var n=picked.indexOf(el);if(n<0){picked.push(el);n=picked.length-1;if(!el._badge){var b=document.createElement('div');b.textContent=n;b.style.cssText='position:absolute;z-index:2147483646;background:#ff6a00;color:#fff;font:700 16px/1 monospace;padding:5px 9px;border-radius:7px;pointer-events:none';document.body.appendChild(b);el._badge=b;place(b,el);}el.style.outline='2px dashed #ff6a00';}
    var els=it,nn=n+1;
    askBox('&lt;'+els.tag+(els.id?'#'+els.id:'')+'&gt; '+els.text,'想怎么改这个元素？回车发送',function(v){
      sendPayload(Object.assign({n:nn,cmd:v},els),v+'（'+els.tag+(els.id?'#'+els.id:'')+'）');
    });
  };
  document.getElementById('pmPage').onclick=function(){
    askBox('对整个网页修改','想怎么改？描述修改要求，回车发送',function(v){
      sendPayload({whole:true,cmd:v},'（整页）'+v);
    });
  };
  document.getElementById('pmUndo').onclick=function(){closeMenu();doUndo();};
  document.getElementById('pmDrag').onclick=function(){closeMenu();window.startEdit(el);};

},true);
document.addEventListener('mousedown',function(e){if(menu&&!e.target.closest('#pickMenu')){menu.remove();menu=null;}},true);
  /* 直接拖动：按住已选中的组件并移动即可进入编辑（不必右键菜单） */
  var _dd=null;
  document.addEventListener('mousedown',function(e){
    var t=e.target;if(t.closest('#pickPanel,#pickMenu'))return;
    var elD=picked.find(function(x){return x===t||x.contains(t);});
    if(!elD)return;
    _dd={el:elD,x:e.clientX,y:e.clientY,armed:true};
  },true);
  document.addEventListener('mousemove',function(e){
    if(!_dd||!_dd.armed)return;
    if(Math.abs(e.clientX-_dd.x)+Math.abs(e.clientY-_dd.y)<6)return;
    _dd.armed=false;var elD=_dd.el;_dd=null;
    startEdit(elD);
    /* 转交拖动：补发一对 mousedown/mousemove */
    var r=elD.getBoundingClientRect();
    elD.dispatchEvent(new MouseEvent('mousedown',{bubbles:true,cancelable:true,clientX:r.x+r.width/2,clientY:r.y+r.height/2}));
    document.dispatchEvent(new MouseEvent('mousemove',{bubbles:true,cancelable:true,clientX:e.clientX,clientY:e.clientY}));
  },true);
  document.addEventListener('mouseup',function(){_dd=null;},true);
render();
})();</script>
